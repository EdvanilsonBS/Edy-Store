<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport: faz o site se adaptar à largura do celular. Não remova. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Edy Store - a loja de tênis e acessórios para o seu estilo.." />
    <!-- Título que aparece na aba do navegador -->
    <title>Edy Store</title>
    <!-- Fonte Inter do Google Fonts. Para usar outra fonte, troque o link abaixo e o
         font-family em src/index.css. -->
    <link rel="icon" type="image/png" href="/logo512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- O React desenha o site inteiro dentro desta div (veja src/main.jsx) -->
    <div id="root"></div>
    <!-- Ponto de entrada do projeto. Este arquivo NÃO funciona aberto direto no navegador:
         use "npm run dev". -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
